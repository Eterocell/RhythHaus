name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check architecture
        run: ./gradlew architectureCheck --configuration-cache --configuration-cache-problems=fail --no-parallel

      - name: Check Spotless formatting
        run: ./gradlew spotlessCheck --configuration-cache --configuration-cache-problems=fail --no-parallel

      - name: Run Detekt
        run: ./gradlew detekt --configuration-cache --configuration-cache-problems=fail --no-parallel

  tests:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM test battery
        run: >-
          ./gradlew
          jvmTest :androidApp:testDebugUnitTest :feature:library:impl:testAndroidHostTest :desktopApp:test
          --configuration-cache --configuration-cache-problems=fail

      - name: Test convention plugins and architecture rules
        run: |
          ./gradlew :architecture-processor:jar --configuration-cache --configuration-cache-problems=fail
          ./gradlew :build-logic:convention:test -Prhythhaus.architectureProcessorJar="$PWD/architecture-processor/build/libs/architecture-processor.jar" --configuration-cache --configuration-cache-problems=fail

  android-build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble Android debug app
        run: ./gradlew :androidApp:assembleDebug --configuration-cache --configuration-cache-problems=fail --no-parallel

  desktop-build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile desktop Kotlin
        run: ./gradlew :desktopApp:compileKotlin --configuration-cache --configuration-cache-problems=fail --no-parallel

  ios-build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Build iOS app for Simulator
        run: >-
          xcodebuild build
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
